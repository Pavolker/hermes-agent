name: Railway Restart Hermes

on:
  workflow_dispatch:
    inputs:
      reason:
        description: Optional note about why Hermes is being restarted
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: railway-hermes-ops
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  RAILWAY_SERVICE: hermes
  RAILWAY_ENVIRONMENT: production

jobs:
  restart:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: 24

      - name: Validate Railway token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "Missing repository secret RAILWAY_TOKEN." >&2
            echo "Add it in GitHub: Settings > Secrets and variables > Actions." >&2
            exit 1
          fi

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Restart Hermes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RESTART_REASON: ${{ inputs.reason }}
        run: |
          echo "Restarting service '$RAILWAY_SERVICE' in environment '$RAILWAY_ENVIRONMENT'."
          if [ -n "$RESTART_REASON" ]; then
            echo "Reason: $RESTART_REASON"
          fi
          railway restart --service "$RAILWAY_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --yes

      - name: Show service status
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway service status --json
